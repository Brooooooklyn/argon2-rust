      }
      @keyframes grow {
        from { transform: scaleX(0); opacity: 0.4; }
        to   { transform: scaleX(1); opacity: 1; }
      }
      @keyframes fadein {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar, .fade { animation: none; }
      }
