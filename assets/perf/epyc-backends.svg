<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="306" viewBox="0 0 920 306" role="img" aria-label="EPYC Genoa — same-ISA whole-hash speedup">
  <title>EPYC Genoa — same-ISA whole-hash speedup</title>
  <desc>Each Rust backend vs C built for the same ISA tier · two runs × five configs</desc>
  <defs>
    <style><![CDATA[
      .bar {
        transform-box: fill-box;
        transform-origin: left center;
        animation: grow 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .fade { animation: fadein 0.45s ease-out both; }
      @keyframes grow {
        from { transform: scaleX(0); opacity: 0.35; }
        to   { transform: scaleX(1); opacity: 0.9; }
      }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .bar, .fade { animation: none; }
      }
    ]]></style>
  </defs>
  <rect width="920" height="306" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="24" y="28" fill="#e6edf3" font-size="16" font-weight="600"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">EPYC Genoa — same-ISA whole-hash speedup</text>
  <text x="24" y="46" fill="#8b949e" font-size="11"
        font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">Each Rust backend vs C built for the same ISA tier · two runs × five configs</text>
  <line x1="278.0" y1="74" x2="278.0" y2="258"
