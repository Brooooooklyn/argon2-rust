  <rect x="100" y="92" width="700" height="18" rx="9" fill="#21262d"/><rect class="bar" x="147.5" y="92" width="178.0" height="18" rx="9" fill="#3fb950" opacity="0.9" style="animation-delay:0.10s"/><rect x="100" y="136" width="700" height="18" rx="9" fill="#21262d"/><rect class="bar" x="384.7" y="136" width="261.0" height="18" rx="9" fill="#3fb950" opacity="0.9" style="animation-delay:0.20s"/><rect x="100" y="180" width="700" height="18" rx="9" fill="#21262d"/><rect class="bar" x="337.3" y="180" width="308.5" height="18" rx="9" fill="#3fb950" opacity="0.9" style="animation-delay:0.30s"/><rect x="100" y="224" width="700" height="18" rx="9" fill="#21262d"/><rect class="bar" x="491.5" y="224" width="308.5" height="18" rx="9" fill="#3fb950" opacity="0.9" style="animation-delay:0.40s"/>
