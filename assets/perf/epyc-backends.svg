  <text class="fade" x="333.4" y="105" fill="#e6edf3" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" style="animation-delay:0.30s">0.89x – 1.04x</text><text class="fade" x="653.8" y="149" fill="#e6edf3" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" style="animation-delay:0.40s">1.09x – 1.31x</text><text class="fade" x="653.8" y="193" fill="#e6edf3" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" style="animation-delay:0.50s">1.05x – 1.31x</text><text class="fade" x="808.0" y="237" fill="#e6edf3" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" style="animation-delay:0.60s">1.18x – 1.44x</text>
