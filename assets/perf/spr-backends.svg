        to   { transform: scaleX(1); opacity: 0.9; }
      }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .bar, .fade { animation: none; }
      }
    ]]></style>
