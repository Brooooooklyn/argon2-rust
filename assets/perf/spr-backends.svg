<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="306" viewBox="0 0 920 306" role="img" aria-label="Sapphire Rapids — same-ISA whole-hash speedup">
