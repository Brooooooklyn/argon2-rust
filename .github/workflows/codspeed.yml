name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  # Lets CodSpeed trigger a backtest run to seed the baseline history.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  # OpenID Connect authentication with CodSpeed; no token to rotate.
  id-token: write

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup rust toolchain, cache and cargo-codspeed binary
        uses: moonrepo/setup-rust@v1
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      # Only the `codspeed` target. `argon2` sweeps 256 MiB working sets and
      # shells out to a C build, and `micro` is an interactive loop — neither
      # belongs under an instrumented CI run. See `benches/codspeed.rs`.
      - name: Build the benchmark target
        run: cargo codspeed build --bench codspeed

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: cargo codspeed run --bench codspeed
