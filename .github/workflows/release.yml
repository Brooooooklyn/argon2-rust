name: Release-plz

# Automates crates.io releases the way napi-rs does:
#   1. On every push to main, open/update a "release PR" that bumps version
#      and changelog from conventional commits.
#   2. When that PR lands, publish any package whose Cargo.toml version is
#      not yet on crates.io, then create the matching git tag + GitHub Release.
#
# Publishing uses crates.io Trusted Publishing (OIDC → short-lived token).
# crates.io matches the JWT against the Trusted Publisher on the crate, so
# THREE values must agree or the exchange is refused:
#   repository  Brooooooklyn/argon2-rust
#   workflow    release.yml   (this file)
#   environment release       (the `environment:` key on the publish job)
# Renaming this file or dropping the environment without updating crates.io
# breaks publishing. The crate is `trustpub_only`, so an API token cannot
# work around a misconfig. The human gate is merging the release PR; this
# job also runs on every main push and is a no-op when already published.

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  # Release unpublished packages.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Brooooooklyn' }}
    # Required: Trusted Publisher is configured with Environment = release.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  # Create a PR with the new versions and changelog, preparing the next release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'Brooooooklyn' }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
