name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Vendored test reference: official KAT traces + differential-test C source.
  # Independent clone (see .gitignore), pinned to a known-good commit.
  PHC_COMMIT: f57e61e19229e23c4445b85494dbf7c07de721cb

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm is the GitHub-hosted Linux aarch64 runner; it is
        # the only CI coverage of the NEON backend and the Linux+arm64
        # mmap arena path.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Clone phc-winner-argon2 (KAT traces + differential reference)
        run: |
          git clone --filter=blob:none https://github.com/P-H-C/phc-winner-argon2.git phc-winner-argon2
          cd phc-winner-argon2 && git checkout "$PHC_COMMIT"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Full suite: KAT traces, official vectors, live differential vs the C
      # (needs make + cc, present on both runners), reuse, allocation audit.
      - name: cargo test (release)
        run: cargo test --release

      - name: cargo test (debug)
        run: cargo test

      - name: cargo test (--no-default-features)
        run: cargo test --release --no-default-features

      - name: cargo test (--all-features)
        run: cargo test --release --all-features

  windows:
    name: build + tests (windows ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
          # 32-bit matters for more than coverage arithmetic: on x86 Windows
          # `extern "system"` is `__stdcall` and decorates the symbol, so an FFI
          # declaration that is merely `extern "C"` links fine on x86_64 and
          # fails only here. `src/random.rs` had exactly that bug. The runner is
          # x86_64, so this leg cross-compiles and runs the i686 binary under
          # WOW64 — which Windows does natively.
          - arch: i686
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # The differential/KAT integration tests need the vendored C tree and
      # make; unit tests cover the fill backends and core logic on Windows.
      - run: cargo build --release --target ${{ matrix.target }}
      - run: cargo test --release --target ${{ matrix.target }} --lib
      # `vectors` is what actually *calls* ProcessPrng. Without a call the
      # import is never resolved and the ABI would go untested.
      - run: cargo test --release --target ${{ matrix.target }} --test vectors

  no-std:
    name: no_std build (thumbv7em-none-eabi)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - run: cargo build --release --no-default-features --target thumbv7em-none-eabi

  entropy-target-matrix:
    name: builds where there is no entropy source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown, wasm32-wasip1, wasm32-wasip2
      - uses: Swatinem/rust-cache@v2
      # `src/random.rs` must never make a target uncompilable just because it
      # has no entropy backend. It did once: a `compile_error!` arm took the
      # whole crate — hashing included — down on every std target that is not
      # unix, windows or WASI p1. `wasm32-unknown-unknown` is exactly such a
      # target and is the cheapest one to keep in CI.
      - run: cargo check --release --target wasm32-unknown-unknown
      # All three WASI previews report `target_os = "wasi"` and differ only in
      # `target_env`. p1 imports `wasi_snapshot_preview1::random_get`; p2 and p3
      # must NOT, because their entropy is a component-model interface. These
      # legs pin that the cfg split keeps compiling for both.
      - run: cargo check --release --target wasm32-wasip1
      - run: cargo check --release --target wasm32-wasip2

  old-glibc:
    name: link + run on glibc 2.17 (manylinux2014)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `src/random.rs` must not name a libc symbol that only exists in newer
      # glibc. It used to declare `getrandom` directly, which glibc gained in
      # 2.25 — so this exact image failed to LINK, and the module's own
      # /dev/urandom fallback could not help, because a missing symbol is a link
      # error rather than a runtime errno. `syscall(2)` has always been there.
      #
      # Deliberately a `docker run` rather than a job-level `container:`:
      # GitHub's container support injects a node20 runner, which needs glibc
      # 2.28 and cannot start here.
      #
      # This is where a napi-rs-style native addon gets built, so it is a
      # first-class target rather than a curiosity.
      - name: build and run inside manylinux2014
        run: |
          docker run --rm -v "$PWD":/w -w /w \
            quay.io/pypa/manylinux2014_x86_64 bash -euo pipefail -c '
              # NOT `| head -1`: head exits after the first line while ldd is
              # still writing the rest, so ldd takes a SIGPIPE, `pipefail` turns
              # that into 141 and `-e` kills the job before curl ever runs.
              # Measured in this image: 95 of 300 runs. `sed -n 1p` reads to EOF.
              ldd --version | sed -n 1p
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain stable
              . "$HOME/.cargo/env"
              export CARGO_TARGET_DIR=/tmp/target
              cargo build --release
              # Building is not enough: the symbol has to resolve at link time
              # and the code has to actually run, so link and execute a binary
              # that calls the entropy path.
              cargo test --release --test vectors
            '

  wasm:
    name: wasm (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: wasip1, simd128
            target: wasm32-wasip1
            runner: wasmtime run --dir=/
            wasmtime-version: "" # latest
            features: +simd128
            suites: --test kat --test vectors --test reuse --test allocation_audit
          - name: wasip1, scalar fallback
            target: wasm32-wasip1
            runner: wasmtime run --dir=/
            wasmtime-version: ""
            features: -simd128
            suites: --test kat --test vectors
          - name: wasip1-threads, simd128
            target: wasm32-wasip1-threads
            runner: wasmtime run -W threads=y -S threads=y --dir=/
            # wasi-threads was removed from wasmtime after v38; this leg is
            # pinned to the last version that runs it.
            wasmtime-version: "@38.0.4"
            features: +simd128
            suites: --test kat --test vectors --test reuse --test allocation_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Clone phc-winner-argon2 (KAT traces)
        run: |
          git clone --filter=blob:none https://github.com/P-H-C/phc-winner-argon2.git phc-winner-argon2
          cd phc-winner-argon2 && git checkout "$PHC_COMMIT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: wasmtime${{ matrix.wasmtime-version }}
      # `wasmtime run --dir=/` so the guest can read the KAT files through
      # the host-absolute CARGO_MANIFEST_DIR. differential is excluded (it
      # needs make + cc); catch_unwind tests are cfg'd out on wasm32
      # (panic=abort), thread tests only on plain wasip1 (see build.rs).
      - name: cargo test
        run: cargo test --release --target ${{ matrix.target }} --lib ${{ matrix.suites }}
        env:
          RUSTFLAGS: -C target-feature=${{ matrix.features }}
          CARGO_TARGET_WASM32_WASIP1_RUNNER: ${{ matrix.runner }}
          CARGO_TARGET_WASM32_WASIP1_THREADS_RUNNER: ${{ matrix.runner }}

  benches-compile:
    name: benches compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --benches --features internal-api

  # The SIMD paths are platform-independent in behaviour (KAT-verified per
  # backend), so the sanitizer-style jobs run on both arches: x86_64-linux
  # covers the SSE2/AVX2/AVX-512 builds, aarch64-mac covers the NEON build.
  # Under Miri, detect() returns Scalar on every host (see fill_block::mod),
  # which is what makes the Miri matrix meaningful: same interpreted code,
  # two host compilers and two arena backings (mmap on Linux, heap on macOS).

  miri:
    name: miri (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # Scoped to allocation_audit on purpose: it carries MIRI-scaled
      # parameters by design (`MIRI` consts) and drives the whole
      # unsafe surface — arena/workspace state machine, wipe-before-free,
      # unwind paths, threaded release — through real hashes at Miri-feasible
      # sizes. The lib tests have no such scaling; several allocate and wipe
      # hundreds of MiB, which is hours under an interpreter, and the SIMD
      # modules use intrinsics Miri does not implement at all.
      - name: cargo miri test (allocation_audit)
        run: cargo miri test --release --test allocation_audit

  asan:
    name: asan (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Clone phc-winner-argon2 (KAT traces + differential reference)
        run: |
          git clone --filter=blob:none https://github.com/P-H-C/phc-winner-argon2.git phc-winner-argon2
          cd phc-winner-argon2 && git checkout "$PHC_COMMIT"
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Doctests are excluded: rustdoc does not link the sanitizer runtime
      # (a rustc limitation, not a bug here). Everything else — the full
      # suite including the live-C differential — runs under ASan.
      - name: cargo test --release (ASan)
        run: cargo test --release --lib --tests --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -Zsanitizer=address

  fuzz:
    name: fuzz (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # --target is explicit on both: cargo-fuzz's defaults are
          # x86_64-unknown-linux-musl on Linux (static libc — the sanitizer
          # runtime cannot link into it) and x86_64-apple-darwin on macOS
          # (not the runner's native target, std not installed).
          - os: ubuntu-latest
            target-flag: --target x86_64-unknown-linux-gnu
          - os: macos-latest
            target-flag: --target aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # phc_decode: the PHC string parser, which eats attacker-controlled
      # input. tiny_hash: parameter validation + the whole hash pipeline at
      # fuzzer-derived shapes. Both assert only "never panics".
      - run: cargo fuzz run phc_decode ${{ matrix.target-flag }} -- -max_total_time=300
      - run: cargo fuzz run tiny_hash ${{ matrix.target-flag }} -- -max_total_time=300
